# Weekly dependency updates (design doc 7.3: dependency scanning).
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule: { interval: "weekly" }
    target-branch: "develop"
    open-pull-requests-limit: 5
    groups:
      microsoft:
        patterns: ["Microsoft.*", "Npgsql*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    target-branch: "develop"
